[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    property: Property-based tests
    slow: Slow running tests

# Hypothesis settings
hypothesis_profile = default

[hypothesis]
# Default profile for property-based testing
# Minimum 100 iterations for statistical confidence
default:
    max_examples = 100
    deadline = None
    print_blob = True
